<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-labelledby="t d">
  <title id="t">Dex privacy at a glance</title>
  <desc id="d">Three facts: Dex runs at home on hardware you own, its default LLM option is EU-based (Mistral AI, Paris), and you can switch to a fully local model whenever you want.</desc>
  <style>
    .f { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
    .h { font-size: 21px; font-weight: 700; fill: #14213D; }
    .s { font-size: 14px; fill: #5C6B82; }
  </style>
  <rect width="1280" height="260" rx="28" fill="#EEF2F7"/>

  <g class="f">
    <rect x="30" y="30" width="380" height="200" rx="20" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <circle cx="86" cy="94" r="26" fill="#0E9AA7"/>
    <path d="M86 80 L98 92 L98 106 L74 106 L74 92 Z" fill="#FFFFFF"/>
    <rect x="82" y="96" width="8" height="10" rx="2" fill="#0E9AA7"/>
    <text class="h" x="34" y="158">Runs at home</text>
    <text class="s" x="34" y="186">Your server, your data, your hardware.</text>

    <rect x="450" y="30" width="380" height="200" rx="20" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <rect x="482" y="78" width="48" height="32" rx="6" fill="#0B3D91"/>
    <g fill="#FFCC00">
      <circle cx="521" cy="94" r="1.8"/>
      <circle cx="519" cy="99" r="1.8"/>
      <circle cx="513.5" cy="102.7" r="1.8"/>
      <circle cx="506" cy="104" r="1.8"/>
      <circle cx="498.5" cy="102.7" r="1.8"/>
      <circle cx="493" cy="99" r="1.8"/>
      <circle cx="491" cy="94" r="1.8"/>
      <circle cx="493" cy="89" r="1.8"/>
      <circle cx="498.5" cy="85.3" r="1.8"/>
      <circle cx="506" cy="84" r="1.8"/>
      <circle cx="513.5" cy="85.3" r="1.8"/>
      <circle cx="519" cy="89" r="1.8"/>
    </g>
    <text class="h" x="454" y="158">EU-based option</text>
    <text class="s" x="454" y="186">Default brain: Mistral AI, based in Paris.</text>

    <rect x="870" y="30" width="380" height="200" rx="20" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <g transform="translate(900 66)">
      <path d="M26 0 L50 9 V28 C50 44 40 54 26 60 C12 54 2 44 2 28 V9 Z" fill="#5B4BDB" stroke="#14213D" stroke-width="3" stroke-linejoin="round"/>
      <path d="M15 30 L23 38 L38 22" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="h" x="874" y="158">Nothing forced</text>
    <text class="s" x="874" y="186">Switch to fully local whenever you want.</text>
  </g>
</svg>
