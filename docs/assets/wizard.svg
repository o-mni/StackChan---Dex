<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-labelledby="t d">
  <title id="t">Dex setup wizard</title>
  <desc id="d">A phone showing step 4 of the setup wizard, choosing between Mistral API and a local model, next to the six wizard steps.</desc>
  <rect width="1280" height="540" rx="28" fill="#EEF2F7"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif">
    <rect x="90" y="30" width="300" height="480" rx="44" fill="#14213D"/>
    <rect x="104" y="44" width="272" height="452" rx="32" fill="#FFFFFF"/>
    <rect x="210" y="56" width="60" height="8" rx="4" fill="#14213D"/>
    <text x="128" y="100" font-size="14" fill="#5C6B82">Step 4 of 6</text>
    <rect x="128" y="112" width="224" height="6" rx="3" fill="#DCE3EE"/>
    <rect x="128" y="112" width="149" height="6" rx="3" fill="#0E9AA7"/>
    <text x="128" y="156" font-size="23" font-weight="700" fill="#14213D">Choose a brain</text>
    <text x="128" y="180" font-size="14" fill="#5C6B82">You can change this any time.</text>

    <rect x="128" y="198" width="224" height="74" rx="14" fill="#DDF3F5" stroke="#0E9AA7" stroke-width="2.5"/>
    <circle cx="152" cy="235" r="10" fill="none" stroke="#0E9AA7" stroke-width="2.5"/>
    <circle cx="152" cy="235" r="5" fill="#0E9AA7"/>
    <text x="172" y="230" font-size="16" font-weight="700" fill="#14213D">Mistral API</text>
    <text x="172" y="252" font-size="13" fill="#5C6B82">Free tier, cloud-based</text>

    <rect x="128" y="284" width="224" height="74" rx="14" fill="#FFFFFF" stroke="#B9C3D6" stroke-width="2"/>
    <circle cx="152" cy="321" r="10" fill="none" stroke="#8A97AD" stroke-width="2.5"/>
    <text x="172" y="316" font-size="16" font-weight="700" fill="#14213D">Local model</text>
    <text x="172" y="338" font-size="13" fill="#5C6B82">Private, needs a GPU</text>

    <rect x="128" y="372" width="224" height="50" rx="12" fill="#FDEBCF"/>
    <text x="142" y="393" font-size="13" fill="#7A4A06">Security and personal topics</text>
    <text x="142" y="411" font-size="13" fill="#7A4A06">always stay on your server.</text>

    <rect x="128" y="438" width="224" height="44" rx="22" fill="#0E9AA7"/>
    <text x="240" y="466" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Continue</text>

    <circle cx="490" cy="78" r="22" fill="#14213D"/>
    <path d="M480 78 L487 85 L501 71" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="532" y="74" font-size="20" font-weight="700" fill="#14213D">Flash Dex</text>
    <text x="532" y="97" font-size="16" fill="#5C6B82">Plug in the robot and install firmware from your browser.</text>
    <circle cx="490" cy="152" r="22" fill="#14213D"/>
    <path d="M480 152 L487 159 L501 145" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="532" y="148" font-size="20" font-weight="700" fill="#14213D">Connect to Wi-Fi</text>
    <text x="532" y="171" font-size="16" fill="#5C6B82">Send Wi-Fi details over USB or Bluetooth (2.4 GHz only).</text>
    <circle cx="490" cy="226" r="22" fill="#14213D"/>
    <path d="M480 226 L487 233 L501 219" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="532" y="222" font-size="20" font-weight="700" fill="#14213D">Pair with your server</text>
    <text x="532" y="245" font-size="16" fill="#5C6B82">Dex finds your home server and confirms a pairing code.</text>
    <rect x="450" y="268" width="770" height="64" rx="18" fill="#FFFFFF"/>
    <circle cx="490" cy="300" r="22" fill="#0E9AA7"/>
    <text x="490" y="307" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="532" y="296" font-size="20" font-weight="700" fill="#14213D">Choose a brain</text>
    <text x="532" y="319" font-size="16" fill="#5C6B82">Mistral API for now, or a local model on your server.</text>
    <circle cx="490" cy="374" r="21" fill="#FFFFFF" stroke="#14213D" stroke-width="2.5"/>
    <text x="490" y="381" font-size="19" font-weight="700" fill="#14213D" text-anchor="middle">5</text>
    <text x="532" y="370" font-size="20" font-weight="700" fill="#14213D">Make Dex yours</text>
    <text x="532" y="393" font-size="16" fill="#5C6B82">Name, voice, personality, and wake word.</text>
    <circle cx="490" cy="448" r="21" fill="#FFFFFF" stroke="#14213D" stroke-width="2.5"/>
    <text x="490" y="455" font-size="19" font-weight="700" fill="#14213D" text-anchor="middle">6</text>
    <text x="532" y="444" font-size="20" font-weight="700" fill="#14213D">Privacy check</text>
    <text x="532" y="467" font-size="16" fill="#5C6B82">See what stays local and what may go to the cloud.</text>
  </g>
</svg>
