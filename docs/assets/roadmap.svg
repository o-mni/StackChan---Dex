<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-labelledby="t d">
  <title id="t">Dex roadmap</title>
  <desc id="d">Six phases: foundation, voice and brain, memory, skills, companion app and wizard, fully local.</desc>
  <style>
    .f { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
    .n { font-size: 22px; font-weight: 700; }
    .h { font-size: 20px; font-weight: 700; fill: #14213D; }
    .s { font-size: 15px; fill: #5C6B82; }
  </style>
  <rect width="1280" height="330" rx="28" fill="#EEF2F7"/>
  <line x1="120" y1="110" x2="1160" y2="110" stroke="#B9C3D6" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="110" x2="224" y2="110" stroke="#0E9AA7" stroke-width="4" stroke-linecap="round"/>
  <g class="f">
    <rect x="86" y="34" width="68" height="30" rx="15" fill="#0E9AA7"/>
    <text x="120" y="55" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Now</text>
    <path d="M114 64 L120 72 L126 64 Z" fill="#0E9AA7"/>
    <circle cx="120" cy="110" r="28" fill="#0E9AA7"/>
    <text class="n" x="120" y="118" text-anchor="middle" fill="#FFFFFF">0</text>
    <text class="h" x="120" y="182" text-anchor="middle">Foundation</text>
    <text class="s" x="120" y="214" text-anchor="middle">Flash the firmware</text>
    <text class="s" x="120" y="240" text-anchor="middle">Linux + Docker server</text>
    <text class="s" x="120" y="266" text-anchor="middle">Robot on its own VLAN</text>
    <circle cx="328" cy="110" r="28" fill="#FFFFFF" stroke="#14213D" stroke-width="3"/>
    <text class="n" x="328" y="118" text-anchor="middle" fill="#14213D">1</text>
    <text class="h" x="328" y="182" text-anchor="middle">Voice + brain</text>
    <text class="s" x="328" y="214" text-anchor="middle">Self-hosted gateway</text>
    <text class="s" x="328" y="240" text-anchor="middle">Mistral via API</text>
    <text class="s" x="328" y="266" text-anchor="middle">Local STT and TTS</text>
    <circle cx="536" cy="110" r="28" fill="#FFFFFF" stroke="#14213D" stroke-width="3"/>
    <text class="n" x="536" y="118" text-anchor="middle" fill="#14213D">2</text>
    <text class="h" x="536" y="182" text-anchor="middle">Memory</text>
    <text class="s" x="536" y="214" text-anchor="middle">Conversation history</text>
    <text class="s" x="536" y="240" text-anchor="middle">Local embeddings</text>
    <text class="s" x="536" y="266" text-anchor="middle">Search your notes</text>
    <circle cx="744" cy="110" r="28" fill="#FFFFFF" stroke="#14213D" stroke-width="3"/>
    <text class="n" x="744" y="118" text-anchor="middle" fill="#14213D">3</text>
    <text class="h" x="744" y="182" text-anchor="middle">Skills</text>
    <text class="s" x="744" y="214" text-anchor="middle">Reminders, calendar</text>
    <text class="s" x="744" y="240" text-anchor="middle">Network watch, CVEs</text>
    <text class="s" x="744" y="266" text-anchor="middle">Confirm by touch</text>
    <circle cx="952" cy="110" r="28" fill="#FFFFFF" stroke="#14213D" stroke-width="3"/>
    <text class="n" x="952" y="118" text-anchor="middle" fill="#14213D">4</text>
    <text class="h" x="952" y="182" text-anchor="middle">App + wizard</text>
    <text class="s" x="952" y="214" text-anchor="middle">Web flasher</text>
    <text class="s" x="952" y="240" text-anchor="middle">Setup wizard (PWA)</text>
    <text class="s" x="952" y="266" text-anchor="middle">Android + iOS</text>
    <circle cx="1160" cy="110" r="28" fill="#14213D"/>
    <text class="n" x="1160" y="118" text-anchor="middle" fill="#FFFFFF">5</text>
    <text class="h" x="1160" y="182" text-anchor="middle">Fully local</text>
    <text class="s" x="1160" y="214" text-anchor="middle">Ollama on a GPU</text>
    <text class="s" x="1160" y="240" text-anchor="middle">Mistral open weights</text>
    <text class="s" x="1160" y="266" text-anchor="middle">Zero-cloud mode</text>
  </g>
</svg>
